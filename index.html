<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nota Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f8f9fa;
    }

    .nota-box {
      width: 100%;
      max-width: 800px;
      border: 1px solid #ccc;
      padding: 20px;
      margin: auto;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: relative;
      padding-bottom: 50px; /* Tambahan padding bawah untuk ruang stempel */
    }

    /* Style untuk Judul dan Subjudul */
  h4 {
    font-size: 2rem;
    font-weight: bold;
    color: #cc7f07;
  }

  h6 {
    font-size: 1.2rem;
    color: #777;
  }

  h3 {
    font-size: 1rem;
    font-weight: bold;
    color: #333;
    margin-top: 1rem;
  }

  .table-responsive {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 40px;
}

.table th, .table td {
  white-space: nowrap;
}

/* Menambahkan border pada semua sel tabel */
.table-bordered td, .table-bordered th {
  border: 1px solid #ddd; /* Menetapkan warna border yang lebih terang agar terlihat jelas */
}

/* Border di seluruh tabel */
.table-bordered {
  border-collapse: collapse; /* Pastikan border pada sel bertemu dengan rapi */
  width: 100%;
}

/* Menambahkan garis vertikal di semua kolom */
.table-bordered td, .table-bordered th {
  border-right: 1px solid #ddd; /* Garis vertikal di antara kolom */
}

/* Menambahkan garis horizontal antara baris */
.table-bordered tr td {
  border-bottom: 1px solid #ddd; /* Garis horizontal antara baris */
}

/* Menambahkan border kanan di kolom terakhir */
.table-bordered td:last-child, .table-bordered th:last-child {
  border-right: 1px solid #ddd; /* Menambahkan border pada kolom terakhir */
}

  .row-custom {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 15px;
}

/* Bagian Pembeli */
.form-pembeli {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-start;
}

.form-pembeli label {
  white-space: nowrap;
  min-width: 75px;
  margin: 0;
}

.form-pembeli input {
  flex-grow: 1;
  border: none;
  border-radius: 0;
  padding: 4px 8px;
  background: transparent;
}


/* Bagian Tanggal */
.form-tanggal {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
}

.form-tanggal label {
  white-space: nowrap;
  min-width: 70px;
  margin: 0;
}

.form-tanggal input {
  flex-grow: 1;
  border: none;
  border-radius: 0;
  padding: 4px 8px;
  background: transparent;
}

.form-tanggal input[type="date"] {
  border: none;
  border-radius: 0;
  padding: 4px 6px;
  background: transparent;
  width: 100%;
  max-width: 120px; /* atau sesuai keinginan */
}


    .signature-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      text-align: center;
    }

    .signature-section img {
      width: 80px;
      height: auto;
    }

    .table-responsive {
      overflow-x: auto;
    }

  .table input {
      border: none;
      background: transparent;
      width: 100%;
      padding: 0;
      font-size: 1rem;
    }

.table input:focus {
  outline: none;
  box-shadow: none;
}

.input-inline {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1rem;
}

.input-inline label {
  min-width: 50px;
  margin: 0;
}

.input-inline input {
  flex-grow: 1;
  border: none;
  background: transparent;
  padding: 0;
  outline: none;
}


.nota-footer {
  position: relative;
  padding: 20px 30px;
}

.text-end {
  font-size: 0.9rem; /* Mengurangi ukuran font pada layar kecil */
  text-align: left;
  right: -29px;
  position: relative; /* Menambahkan posisi relatif */
  top: -40px;
}

.no-print {
  display: block;
}

.capture-mode .no-print {
  display: none !important;
}


/* Stempel tetap di tengah dan lebih naik */
.stempel {
  position: absolute;
  top: calc(100% + -110px); /* Posisi stempel sedikit lebih bawah dari total keseluruhan */
  left: 50%;
  transform: translateX(-50%);
  width: 250px; /* Ukuran default untuk desktop */
  opacity: 0.5;
  z-index: 0;
  pointer-events: none;
}

.materai {
  position: absolute;
  top: 10px; /* Posisi di bawah total keseluruhan */
  right: 35px;
  width: 100px; /* Ukuran default untuk desktop */
  opacity: 0.8;
  z-index: 0;
  pointer-events: none;
}

/* Menata note di dalam nota box */
.nota-footer-note {
  background-color: white;
  padding: 10px;
  font-size: 1rem;
  color: #333;
  margin-top: 20px;
}

/* Styling untuk textarea agar terlihat lebih rapi */
#note {
  padding: 10px;
  resize: vertical;
}

    /* Responsif: Pastikan header ini menyesuaikan di layar kecil */
  @media (max-width: 576px) {
    .nota-box {
      padding: 15px;
    }

    h4 {
      font-size: 1.25rem;
    }

    h3 {
      font-size: 1rem;
    }

    h6 {
      font-size: 0.9rem;
    }
  
    .table-responsive {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .table th, .table td {
    font-size: 0.9rem;
}
.nota-footer {
    padding: 10px 20px;
  }

  /* Responsif untuk teks "Total Keseluruhan" */
  .text-end {
    font-size: 0.9rem; /* Mengurangi ukuran font pada layar kecil */
    text-align: left;
    right: -17px;
    position: relative; /* Menambahkan posisi relatif */
    top: -40px;
  }

  /* Stempel responsif */
  .stempel {
    width: 150px; /* Ukuran stempel lebih kecil di layar kecil */
    top: calc(100% + -75px); /* Posisi stempel sedikit lebih tinggi */
    left: 230px;
  }

  /* Materai responsif */
  .materai {
    width: 80px; /* Ukuran materai lebih kecil di layar kecil */
    right: 10%; /* Menyesuaikan posisi ke kanan */
    top: -5px;
  }

  .nota-footer-note {
    font-size: 0.9rem; /* Menyesuaikan ukuran font untuk layar kecil */
  }
}

  </style>
</head>
<body>

<div class="nota-box" id="nota">
  <h4 class="text-center mb-1">FURNITI</h4>
  <h6 class="text-center mb-4">Jl. Tunggala Dalam. 123, Kendari • 0823-9368-0129</h6>
  <h3 class="text-center">NOTA PENJUALAN</h3>
  
  <!-- Pembeli dan Tanggal sejajar -->
  <div class="row-custom">
    <div class="form-pembeli">
      <label for="pembeli"><strong>Pembeli :</strong></label>
      <input type="text" id="pembeli" class="form-control" placeholder="Nama Pembeli" />
    </div>
    <div class="form-tanggal">
      <label for="tanggal"><strong>Tanggal :</strong></label>
      <input type="date" id="tanggal" class="form-control" />
    </div>
  </div>
  
  

  <div class="input-inline">
    <label for="No Nota"><strong>No Nota :</strong></label>
    <input type="text" id="pembeli" placeholder="Masukan Code" />
  </div>
  

  <div class="table-responsive">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Nama Barang</th>
          <th>Jumlah</th>
          <th>Harga Satuan</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="nota-body">
        <tr>
          <td><input type="text" placeholder="Nama Barang" /></td>
          <td><input type="number" value="1" class="jumlah" /></td>
          <td><input type="number" class="harga" placeholder="Harga" /></td>
          <td class="total-per-barang">Rp 0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <button class="btn btn-sm btn-secondary mb-3 no-print" onclick="tambahBaris()">+ Tambah Barang</button>

  <div class="nota-footer position-relative">
    <div class="text-end">
      <p><strong>Total Keseluruhan:</strong> <span id="total-semua">Rp 0</span></p>
    </div>
    <!-- Stempel tetap berada di tengah halaman -->
    
  
  <img src="https://i.imgur.com/EKFFGHp.png" alt="Stempel" class="stempel" />
  
  <img id="materai-img" alt="Materai" class="materai" style="display: none;" />
  </div>
  
  <!-- Catatan di dalam nota box yang bisa diisi sendiri -->
<div class="nota-footer-note mt-4">
  <label for="note"><strong>Catatan:</strong></label>
  <textarea id="note" class="form-control" rows="4" placeholder="Masukkan catatan tambahan di sini..."></textarea>
</div>


</div>

<div class="text-center mt-4">
  <button class="btn btn-primary me-2" onclick="downloadPDF()">Download PDF</button>
  <button class="btn btn-secondary" onclick="downloadJPG()">Download JPG</button>
</div>

<div class="mt-3 text-center">
  <label for="upload-materai" class="form-label"><strong>Upload Materai (opsional):</strong></label><br />
  <input type="file" id="upload-materai" accept="image/*" class="form-control w-auto mx-auto" />
</div>

<!-- Script html2canvas & jsPDF -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  window.onload = function () {
    document.getElementById("tanggal").valueAsDate = new Date();
    hitungTotal();
  };

  function formatRupiah(number) {
    return new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR'
    }).format(number);
  }

  function hitungTotal() {
    const rows = document.querySelectorAll("#nota-body tr");
    let totalSemua = 0;
    rows.forEach(row => {
      const jumlah = Number(row.querySelector(".jumlah").value) || 0;
      const harga = Number(row.querySelector(".harga").value) || 0;
      const total = jumlah * harga;
      row.querySelector(".total-per-barang").innerText = formatRupiah(total);
      totalSemua += total;
    });
    document.getElementById("total-semua").innerText = formatRupiah(totalSemua);
  }

  document.addEventListener("input", hitungTotal);


  function tambahBaris() {
    const baris = document.createElement("tr");
    baris.innerHTML = `
      <td><input type="text" placeholder="Nama Barang" /></td>
      <td><input type="number" class="jumlah" /></td>
      <td><input type="number" class="harga" /></td>
      <td class="total-per-barang">Rp 0</td>
    `;
    document.getElementById("nota-body").appendChild(baris);
  }

  function prepareNotaForDownload(callback) {
  const nota = document.getElementById("nota");
  const addButton = document.querySelector("button.btn-secondary"); // Tombol Tambah Barang
  const table = document.querySelector(".table-responsive"); // Tabel yang ingin ditampilkan

  // Sembunyikan tombol tambah barang
  addButton.style.display = "none";

  // Set lebar sementara jadi 800px
  const originalWidth = nota.style.width;
  nota.style.width = "800px";

  // Matikan media query responsif untuk memastikan tampilan desktop
  const styleTag = document.createElement("style");
  styleTag.innerHTML = `
    @media (max-width: 576px) {
      .nota-box {
        padding: 20px;
      }
      h4 {
        font-size: 2rem;
      }
      h3 {
        font-size: 1.2rem;
      }
      h6 {
        font-size: 1rem;
      }
      .table th, .table td {
        font-size: 1rem;
      }
      .stempel {
        width: 250px; /* Ukuran stempel default desktop */
        top: calc(100% + -110px); /* Posisi stempel sesuai desktop */
      }
      .materai {
        width: 100px; /* Ukuran materai default desktop */
      }
    }
  `;
  document.head.appendChild(styleTag);

  // Render ulang layout agar lebar diterapkan
  setTimeout(() => {
    callback(() => {
      // Kembalikan ke lebar semula dan tampilkan tombol kembali
      nota.style.width = originalWidth;
      addButton.style.display = "inline-block";

      // Reset overflow
      table.style.overflowX = "initial";

      // Hapus style responsif tambahan
      document.head.removeChild(styleTag);
    });
  }, 100); // jeda agar layout update
}


function downloadPDF() {
  prepareNotaForDownload((resetStyle) => {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "pt", "a4");
    const element = document.getElementById("nota");

    html2canvas(element, { useCORS: true, scale: 2 }).then((canvas) => {
      const imgData = canvas.toDataURL("image/png");
      const imgProps = pdf.getImageProperties(imgData);
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

      pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);
      pdf.save("nota_digital.pdf");

      resetStyle();
    });
  });
}


function downloadJPG() {
  prepareNotaForDownload((resetStyle) => {
    html2canvas(document.getElementById("nota"), {
      useCORS: true,
      scale: 2,
      allowTaint: true,
    }).then((canvas) => {
      const link = document.createElement("a");
      link.download = "nota_digital.jpg";
      link.href = canvas.toDataURL("image/jpeg", 1.0);
      link.click();

      resetStyle();
    });
  });
}


  document.getElementById("upload-materai").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function (event) {
      const img = document.getElementById("materai-img");
      img.src = event.target.result;
      img.style.display = "block";
    };
    reader.readAsDataURL(file);
  }
});


</script>

</body>
</html>
